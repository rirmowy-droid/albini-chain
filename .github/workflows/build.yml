name: Build VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  JUCE_TAG: 8.0.4

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE

      # No -G: CMake picks the newest Visual Studio installed on the runner.
      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AlbiniChain-Windows-plugins
          path: |
            build/AlbiniChain_artefacts/Release/VST3/
            build/StonogaAlbini_artefacts/Release/VST3/
            build/StonogaAlbini_artefacts/Release/Standalone/
          if-no-files-found: error
          retention-days: 30

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $env:APPVER = "2.9.${{ github.run_number }}"
          & $iscc installer\albini.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build-windows
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9.${{ github.run_number }}
          name: Albini Chain 2.9.${{ github.run_number }}
          make_latest: true
          body: |
            **Windows:** pobierz `AlbiniChain-Setup.exe` i uruchom. Instaluje dwie wtyczki VST3 (**Albini Chain** i **Stonoga x Albini**) do `C:\Program Files\Common Files\VST3` oraz aplikację **Stonoga x Albini (bez DAW)** w menu Start.
            Windows może ostrzec, że aplikacja jest nieznana (instalator nie jest podpisany) — kliknij „Więcej informacji” → „Uruchom mimo to”.
            Potem w programie muzycznym uruchom ponowne skanowanie wtyczek.
          files: dist/*
